name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm 11 — same install path pi uses for this extension, so an
      # unapproved build script (ERR_PNPM_IGNORED_BUILDS) fails CI instead
      # of breaking `pi update` locally.
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

  # The dev dependencies are pinned at the supported floor (exact dev pin 1.4.0;
  # peer range >=1.4.0), so the build job's test run exercises the full suite on
  # the lowest supported Pi, including the isolated-provider guard
  # (test/e2e/isolated-provider.e2e.test.ts). This job runs the same full suite
  # against current Pi so a future Pi change surfaces without blocking.
  compat-latest-pi:
    runs-on: ubuntu-latest
    continue-on-error: true # current Pi is not a hard support guarantee; surface breakage without blocking
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install current Pi
        run: pnpm add @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest # ephemeral job: package.json mutation is fine here
      - name: Full test suite against current Pi
        run: pnpm run test
